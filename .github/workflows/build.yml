name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build x64 plugin
        run: .\analysis\build.ps1
      - name: Test selection, text filters, and settings
        run: .\analysis\test.ps1 -CoreOnly
      - name: Package binary and corresponding source
        run: .\analysis\package.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selection_tts_x64
          path: |
            dist/releases/selection_tts_x64.zip
            dist/releases/selection_tts_x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
